<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12131a"/><stop offset="1" stop-color="#050607"/></linearGradient>
  <linearGradient id="goldbg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17130b"/><stop offset="1" stop-color="#060706"/></linearGradient>
  <linearGradient id="greenbg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0e130b"/><stop offset="1" stop-color="#050706"/></linearGradient>
  <radialGradient id="vio"><stop stop-color="#b787ff" stop-opacity=".55"/><stop offset="1" stop-color="#b787ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold"><stop stop-color="#f2ce72" stop-opacity=".55"/><stop offset="1" stop-color="#f2ce72" stop-opacity="0"/></radialGradient>
  <radialGradient id="lime"><stop stop-color="#bbff65" stop-opacity=".42"/><stop offset="1" stop-color="#bbff65" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- streak -->
<g><rect width="240" height="360" fill="url(#night)"/><ellipse cx="126" cy="230" rx="150" ry="110" fill="url(#vio)" filter="url(#blur)"/><path d="M0 286l44-48 35 25 47-69 49 72 31-35 34 44v85H0z" fill="#0a0a10"/><path d="M18 273h52l12-17 18 44 19-88 18 59 13-26 18 28h56" fill="none" stroke="#f0c9ff" stroke-width="3" filter="url(#glow)"/></g>
<!-- rank -->
<g transform="translate(240)"><rect width="240" height="360" fill="url(#goldbg)"/><ellipse cx="122" cy="180" rx="150" ry="135" fill="url(#gold)" filter="url(#blur)"/><circle cx="122" cy="185" r="67" fill="#0c0b08" stroke="#d3ad58" stroke-width="3"/><circle cx="122" cy="185" r="51" fill="none" stroke="#755b2d"/><path d="M122 129l13 37 39 1-31 23 11 38-32-22-32 22 11-38-31-23 39-1z" fill="#e7c56f" fill-opacity=".78"/><path d="M20 298l60-54 43 31 53-65 64 72v78H0z" fill="#090806"/></g>
<!-- vault -->
<g transform="translate(480)"><rect width="240" height="360" fill="url(#greenbg)"/><ellipse cx="126" cy="222" rx="160" ry="120" fill="url(#lime)" filter="url(#blur)"/><g fill="#caa44c" stroke="#ffe29a" stroke-opacity=".35"><ellipse cx="78" cy="263" rx="34" ry="9"/><rect x="44" y="229" width="68" height="35" rx="4"/><ellipse cx="78" cy="229" rx="34" ry="9"/><ellipse cx="126" cy="246" rx="39" ry="10"/><rect x="87" y="191" width="78" height="56" rx="4"/><ellipse cx="126" cy="191" rx="39" ry="10"/><ellipse cx="171" cy="270" rx="31" ry="8"/><rect x="140" y="234" width="62" height="36" rx="4"/><ellipse cx="171" cy="234" rx="31" ry="8"/></g><path d="M0 314l57-45 48 24 55-62 80 74v55H0z" fill="#070806" opacity=".84"/></g>
<!-- return -->
<g transform="translate(720)"><rect width="240" height="360" fill="#070909"/><ellipse cx="126" cy="145" rx="125" ry="118" fill="url(#gold)" filter="url(#blur)" opacity=".48"/><circle cx="126" cy="151" r="67" fill="#050606" stroke="#d4b15e" stroke-width="2"/><circle cx="126" cy="151" r="84" fill="none" stroke="#8f7138" stroke-opacity=".4"/><path d="M0 312l48-74 39 35 55-83 43 65 55-50v155H0z" fill="#0a0c0b"/><path d="M0 330l66-56 43 29 45-57 45 44 41-31v101H0z" fill="#030404"/></g>
</svg>