name: Evidence Env Metadata Diagnostic

on:
  push:
    branches:
      - diagnostics/evidence-env-metadata

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare current evidence fingerprints without exposing secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");

          function sha256(value) {
            return crypto.createHash("sha256").update(value).digest("hex");
          }

          function fingerprint(kind, values) {
            const normalized = values.map((value) => String(value ?? "").trim());
            if (normalized.some((value) => !value)) return null;
            return sha256(JSON.stringify([kind, ...normalized]));
          }

          const token = process.env.VERCEL_TOKEN;
          if (!token) throw new Error("VERCEL_TOKEN is unavailable.");

          const envUrl = new URL("https://api.vercel.com/v9/projects/pulse/env");
          envUrl.searchParams.set("teamId", "team_NwHeP9IhdhtOffLfyyf60gw2");
          envUrl.searchParams.set("decrypt", "true");
          envUrl.searchParams.set("source", "vercel-cli:pull");

          const envResponse = await fetch(envUrl, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!envResponse.ok) throw new Error(`Vercel env request failed: HTTP ${envResponse.status}`);
          const envPayload = await envResponse.json();
          const envRows = Array.isArray(envPayload.envs) ? envPayload.envs : [];
          const env = new Map(envRows.map((row) => [row.key, typeof row.value === "string" ? row.value : ""]));

          const required = [
            "NEXT_PUBLIC_SITE_URL",
            "NEXT_PUBLIC_SUPABASE_URL",
            "SUPABASE_SERVICE_ROLE_KEY",
            "NEXT_PUBLIC_TURNSTILE_SITE_KEY",
            "TURNSTILE_SECRET_KEY",
            "FAUCETPAY_READ_KEY",
            "FAUCETPAY_SCOPED_KEY",
            "FAUCETPAY_PAYOUT_CURRENCY",
            "FAUCETPAY_PAYOUT_CREDITS",
            "FAUCETPAY_PAYOUT_UNITS",
            "FAUCETPAY_PAYOUT_LABEL",
          ];
          const unavailable = required.filter((key) => !env.get(key) || env.get(key) === "[SENSITIVE]");
          if (unavailable.length) {
            console.log(JSON.stringify({ diagnostic: "DECRYPT_UNAVAILABLE", unavailable }));
            process.exit(0);
          }

          const supabaseUrl = env.get("NEXT_PUBLIC_SUPABASE_URL").trim().replace(/\/$/, "");
          const serviceRole = env.get("SUPABASE_SERVICE_ROLE_KEY").trim();
          async function supabase(path) {
            const response = await fetch(`${supabaseUrl}/rest/v1/${path}`, {
              headers: {
                apikey: serviceRole,
                Authorization: `Bearer ${serviceRole}`,
                Accept: "application/json",
              },
            });
            if (!response.ok) throw new Error(`Supabase diagnostic read failed: HTTP ${response.status}`);
            return response.json();
          }

          const proofRows = await supabase("app_config?key=eq.release_external_proof&select=value");
          const proof = proofRows?.[0]?.value ?? {};
          const checks = {};

          const siteUrl = env.get("NEXT_PUBLIC_SITE_URL");
          const supabasePublicUrl = env.get("NEXT_PUBLIC_SUPABASE_URL");
          const turnstileAllowed = (env.get("TURNSTILE_ALLOWED_HOSTNAMES") || "").trim() || "auto";
          const payoutCurrency = (env.get("FAUCETPAY_PAYOUT_CURRENCY") || "USDT").trim();
          const payoutCredits = env.get("FAUCETPAY_PAYOUT_CREDITS");
          const payoutUnits = env.get("FAUCETPAY_PAYOUT_UNITS");
          const payoutLabel = env.get("FAUCETPAY_PAYOUT_LABEL");

          const expectedTurnstile = fingerprint("turnstile", [
            env.get("TURNSTILE_SECRET_KEY"),
            env.get("NEXT_PUBLIC_TURNSTILE_SITE_KEY"),
            siteUrl,
            turnstileAllowed,
          ]);
          checks.turnstile = proof.turnstile?.fingerprint === expectedTurnstile;

          const expectedRead = fingerprint("faucetpay_read", [
            "faucetpay-read-proof-v2",
            env.get("FAUCETPAY_READ_KEY"),
            payoutCurrency,
            payoutCredits,
            payoutUnits,
            payoutLabel,
          ]);
          checks.faucetpay_read = proof.faucetpay_read?.fingerprint === expectedRead;

          const configuredDailyLimit = Number(env.get("FAUCETPAY_SEND_DAILY_LIMIT_USD"));
          const creditsNumber = Number(payoutCredits);
          const dailyLimit = Number.isFinite(configuredDailyLimit) && configuredDailyLimit > 0
            ? configuredDailyLimit
            : creditsNumber / 1000;
          const dailySource = Number.isFinite(configuredDailyLimit) && configuredDailyLimit > 0
            ? "configured_override"
            : "one_pack_default";
          const expectedSend = fingerprint("faucetpay_send_scope", [
            "faucetpay-send-scope-proof-v2",
            env.get("FAUCETPAY_SCOPED_KEY"),
            payoutCurrency,
            payoutCredits,
            payoutUnits,
            payoutLabel,
            String(dailyLimit),
            dailySource,
            "scope:send-only",
            "daily-cap:exact-value-operator-verified",
          ]);
          checks.faucetpay_send_scope = proof.faucetpay_send_scope?.fingerprint === expectedSend;

          const pwnedContract = [
            "provider:haveibeenpwned-pwned-passwords",
            "lookup:sha1-k-anonymity-prefix-5",
            "response-padding:true",
            "timeout-ms:4000",
            "new-password:fail-closed-on-unavailable",
            "existing-signin:fail-open-on-unavailable",
            "confirmed-compromise:force-password-upgrade",
          ];
          const expectedAuth = fingerprint("supabase_auth_hardening", [
            "auth-breach-protection-proof-v2",
            supabasePublicUrl,
            siteUrl,
            "12",
            ...pwnedContract,
          ]);
          checks.supabase_auth_hardening = proof.supabase_auth_hardening?.fingerprint === expectedAuth;

          const expectedRecovery = fingerprint("password_recovery", [
            "password-recovery-proof-v2",
            supabasePublicUrl,
            siteUrl,
            "12",
            "600",
            "hosted-email:pkce-or-otp",
            "password-update:bounded-recovery-context",
            "fresh-password-signin-required",
          ]);
          checks.password_recovery = proof.password_recovery?.fingerprint === expectedRecovery;

          const payoutWithdrawalId = String(proof.faucetpay_payout?.withdrawal_id ?? "").trim();
          const receiptWithdrawalId = String(proof.faucetpay_receipt?.withdrawal_id ?? "").trim();
          let payoutCurrent = false;
          let receiptCurrent = false;

          if (payoutWithdrawalId) {
            const withdrawalRows = await supabase(
              "withdrawals?id=eq." + encodeURIComponent(payoutWithdrawalId) +
              "&select=id,idempotency_key,payout_provider,asset,destination,amount_credits,payout_amount_units,external_id,status"
            );
            const w = withdrawalRows?.[0];
            if (w && w.status === "paid" && String(w.payout_provider).toLowerCase() === "faucetpay") {
              const configFp = fingerprint("faucetpay_payout", [
                env.get("FAUCETPAY_SCOPED_KEY"),
                payoutCurrency,
                payoutCredits,
                payoutUnits,
                payoutLabel,
              ]);
              const destinationHash = sha256(String(w.destination));
              const identity = [
                String(w.id),
                String(w.idempotency_key).trim(),
                String(w.external_id).trim(),
                String(w.payout_provider).trim().toLowerCase(),
                String(w.asset).trim().toUpperCase(),
                String(w.amount_credits),
                String(w.payout_amount_units),
                destinationHash,
              ];
              const expectedPayout = configFp
                ? sha256(JSON.stringify(["faucetpay-payout-proof-v3", configFp, ...identity]))
                : null;
              payoutCurrent = proof.faucetpay_payout?.withdrawal_id === w.id
                && proof.faucetpay_payout?.fingerprint === expectedPayout;
              const expectedReceipt = expectedPayout
                ? sha256(JSON.stringify(["faucetpay-receipt-proof-v3", expectedPayout, ...identity]))
                : null;
              receiptCurrent = payoutCurrent
                && receiptWithdrawalId === w.id
                && proof.faucetpay_receipt?.fingerprint === expectedReceipt;
            }
          }

          checks.faucetpay_payout = payoutCurrent;
          checks.faucetpay_receipt = receiptCurrent;

          for (const [key, current] of Object.entries(checks)) {
            console.log(JSON.stringify({ evidence: key, status: current ? "CURRENT" : "STALE" }));
          }
          NODE
