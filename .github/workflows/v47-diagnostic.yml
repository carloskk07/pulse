name: V47 Diagnostic

on:
  push:
    branches: ["treasury/payout-pack-authority-v47"]

permissions:
  contents: read

jobs:
  quality-without-external-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Match pinned npm client
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          test "$(npm --version)" = "11.19.1"
      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify governed legal policy bundle
        run: npm run verify:legal
      - name: Verify release safety contracts
        run: npm run verify:safety
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
