name: Dependency Lock Snapshot

on:
  push:
    branches: [chore/reproducible-dependencies]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate lockfile from current dependency contract
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: pulsercuit-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
