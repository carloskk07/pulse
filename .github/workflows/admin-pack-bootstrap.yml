name: Configure FaucetPay read-only pack

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-pack-bootstrap.yml

permissions:
  contents: read

jobs:
  configure-pack:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Upsert FaucetPay production pack
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          cat > /tmp/faucetpay-pack.json <<'JSON'
          [
            {"key":"FAUCETPAY_PAYOUT_CURRENCY","value":"USDT","type":"plain","target":["production"],"comment":"Pulsercuit FaucetPay settlement asset"},
            {"key":"FAUCETPAY_PAYOUT_CREDITS","value":"10","type":"plain","target":["production"],"comment":"0.010 USDT at 1000 credits per USD"},
            {"key":"FAUCETPAY_PAYOUT_UNITS","value":"1000000","type":"plain","target":["production"],"comment":"0.010 USDT at live-proven 100000000 units per USDT"},
            {"key":"FAUCETPAY_PAYOUT_LABEL","value":"0.010 USDT","type":"plain","target":["production"],"comment":"Pulsercuit controlled read-proof payout pack"}
          ]
          JSON
          status="$(curl --silent --show-error --output /tmp/vercel-env-response.json --write-out '%{http_code}' \
            --request POST \
            --url 'https://api.vercel.com/v10/projects/pulse/env?upsert=true&slug=carloskk07s-projects' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/faucetpay-pack.json)"
          case "$status" in 2??) ;; *) echo "Vercel payout-pack upsert failed with HTTP $status" >&2; cat /tmp/vercel-env-response.json >&2; exit 1 ;; esac
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/vercel-env-response.json','utf8'));
          if (Array.isArray(body.failed) && body.failed.length) throw new Error('Vercel reported failed payout-pack environment upserts');
          console.log('FaucetPay read-proof pack upsert confirmed.');
          NODE
