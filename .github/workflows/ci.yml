name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Reject direct pushes to main
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          proof_file="$RUNNER_TEMP/main-pulls.json"
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GITHUB_API_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$proof_file" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"

            if node scripts/verify-deploy-provenance.mjs push "$GITHUB_SHA" "$proof_file"; then
              exit 0
            fi

            echo "Merged-PR provenance has not converged yet (attempt $attempt/5)."
            sleep 3
          done

          echo "Main integrity rejected: $GITHUB_SHA is not proven as a merged PR commit."
          exit 1

      - name: Pin npm security-audit client
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          test "$(npm --version)" = "11.19.1"
      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependency surface
        run: node scripts/audit-production-dependencies.mjs
      - name: Verify governed legal policy bundle
        run: npm run verify:legal
      - name: Verify release safety contracts
        run: npm run verify:safety
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify Home prerender result
        run: node scripts/verify-home-prerender-contract.mjs
