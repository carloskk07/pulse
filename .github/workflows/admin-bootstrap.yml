name: Bootstrap production admin access

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-bootstrap.yml

permissions:
  contents: write

jobs:
  configure-admin:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Require deployment credential
        run: test -n "$VERCEL_TOKEN"
      - name: Link production project
        run: npx --yes vercel@59.17.0 pull --yes --environment=production --project=pulse --scope=carloskk07s-projects --token="$VERCEL_TOKEN"
      - name: Configure current owner as production admin
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_EMAIL="$(git log -2 --format='%ae' | sed -n '2p' | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')"
          test -n "$ADMIN_EMAIL"
          case "$ADMIN_EMAIL" in
            *@*) ;;
            *) echo "Could not resolve a valid admin email from the parent release author." >&2; exit 1 ;;
          esac
          if npx --yes vercel@59.17.0 env ls production --scope=carloskk07s-projects --token="$VERCEL_TOKEN" 2>/dev/null | grep -q 'ADMIN_EMAILS'; then
            printf '%s' "$ADMIN_EMAIL" | npx --yes vercel@59.17.0 env update ADMIN_EMAILS production --scope=carloskk07s-projects --token="$VERCEL_TOKEN"
          else
            printf '%s' "$ADMIN_EMAIL" | npx --yes vercel@59.17.0 env add ADMIN_EMAILS production --scope=carloskk07s-projects --token="$VERCEL_TOKEN"
          fi
      - name: Trigger clean production redeploy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "ops: redeploy after admin access configuration"
          git push origin HEAD:main
